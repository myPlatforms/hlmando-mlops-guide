<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="CNC 설비 센서 → Databricks에서 학습·등록 → @champion 모델을 설비 옆 엣지에서 판정">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1B3139"/>
    </marker>
    <marker id="ahl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#FF3621"/>
    </marker>
    <style>
      text { font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
      .lbl { font-size: 30px; font-weight: 700; fill: #1B3139; }
      .sub { font-size: 24px; font-weight: 500; fill: #6B777C; }
    </style>
  </defs>

  <!-- floor band: continues the hero background (100/1600 of width) -->
  <rect x="0" y="1100" width="1600" height="100" fill="#EFEAE3"/>

  <!-- ===== Databricks (cloud) ===== -->
  <g transform="translate(560 120)">
    <path d="M110 300c-62 0-100-40-100-92 0-50 40-88 92-90 14-62 66-104 132-104 56 0 104 32 124 82 12-4 24-6 38-6 70 0 118 52 118 112 0 56-44 98-104 98z" fill="#fff" stroke="#1B3139" stroke-width="5"/>
    <!-- official Databricks symbol (path from the www.databricks.com header wordmark) -->
    <g transform="translate(176 52) scale(7.6)">
      <path d="m18.318 9.275-8.631 4.859L.445 8.942 0 9.182v3.77l9.687 5.431 8.63-4.84v1.995l-8.63 4.86-9.242-5.192-.445.24v.646l9.687 5.432 9.668-5.432v-3.769l-.445-.24-9.223 5.173-8.65-4.84V10.42l8.65 4.84 9.668-5.43V6.114l-.482-.277-9.186 5.155L1.482 6.41l8.205-4.6 6.741 3.787.593-.332v-.462L9.687.684 0 6.115v.592l9.687 5.432 8.63-4.86z" fill="#FF3621"/>
    </g>
    <text x="250" y="-14" text-anchor="middle" class="lbl">Databricks</text>
    <!-- chips -->
    <g transform="translate(60 330)">
      <rect width="170" height="54" rx="27" fill="#1B3139"/>
      <text x="85" y="36" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">MLflow</text>
      <rect x="190" width="230" height="54" rx="27" fill="#1B3139"/>
      <text x="305" y="36" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">Unity Catalog</text>
    </g>
    <g transform="translate(150 410)">
      <rect width="240" height="58" rx="12" fill="#FFF1EE" stroke="#FF3621" stroke-width="3"/>
      <text x="120" y="39" text-anchor="middle" font-size="28" font-weight="800" fill="#C81E0F">@champion</text>
    </g>
  </g>

  <!-- ===== CNC machine (left) ===== -->
  <g transform="translate(90 430)">
    <rect x="0" y="80" width="420" height="460" rx="22" fill="#1B3139"/>
    <rect x="34" y="120" width="260" height="230" rx="12" fill="#CFE0E6"/>
    <rect x="34" y="120" width="260" height="230" rx="12" fill="none" stroke="#3A5560" stroke-width="6"/>
    <!-- spindle + tool -->
    <rect x="140" y="120" width="48" height="110" fill="#6B777C"/>
    <path d="M150 230h28l-8 44h-12z" fill="#3A4A50"/>
    <rect x="96" y="300" width="136" height="32" rx="4" fill="#9AA4A8"/>
    <!-- control panel -->
    <rect x="316" y="120" width="76" height="150" rx="10" fill="#0F1F24"/>
    <rect x="328" y="134" width="52" height="40" rx="4" fill="#00A972"/>
    <circle cx="341" cy="200" r="9" fill="#FF3621"/><circle cx="367" cy="200" r="9" fill="#E0A100"/>
    <circle cx="341" cy="232" r="9" fill="#9AA4A8"/><circle cx="367" cy="232" r="9" fill="#9AA4A8"/>
    <rect x="34" y="388" width="358" height="22" rx="6" fill="#3A5560"/>
    <rect x="34" y="430" width="358" height="22" rx="6" fill="#3A5560"/>
    <rect x="-10" y="530" width="440" height="20" rx="6" fill="#0F1F24"/>
    <!-- sensor tag -->
    <circle cx="250" cy="80" r="26" fill="#FF3621"/>
    <path d="M238 80a12 12 0 0 1 24 0M231 80a19 19 0 0 1 38 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="210" y="610" text-anchor="middle" class="lbl">VP1 CNC 가공기</text>
    <text x="210" y="646" text-anchor="middle" class="sub">진동 · 온도 · 전류 · 절삭유 압력</text>
  </g>

  <!-- sensor waves rising to the cloud -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M340 470c10-30 30-30 40-60s30-30 40-60 30-30 40-60 26-26 40-48" stroke="#FF3621"/>
    <path d="M390 500c10-30 30-30 40-60s30-30 40-60 30-30 40-60 30-28 50-46" stroke="#1B3139" opacity="0.6"/>
  </g>
  <text x="160" y="380" class="sub">센서 데이터 (10분)</text>

  <!-- ===== Edge gateway (right) ===== -->
  <g transform="translate(1040 560)">
    <rect x="0" y="0" width="470" height="300" rx="20" fill="#1B3139"/>
    <rect x="20" y="20" width="430" height="230" rx="10" fill="#fff"/>
    <!-- chart in the screen -->
    <path d="M44 216H428" stroke="#E7E3DC" stroke-width="3"/>
    <path d="M44 118H428" stroke="#FF3621" stroke-width="4" stroke-dasharray="14 10"/>
    <path d="M44 205c40 0 60-4 100-4s60 6 90-2 40-10 70-30 40-60 64-80 30-36 60-50" fill="none" stroke="#1B3139" stroke-width="7" stroke-linecap="round"/>
    <rect x="300" y="36" width="134" height="46" rx="23" fill="#FF3621"/>
    <text x="367" y="68" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">경보</text>
    <rect x="200" y="300" width="70" height="80" fill="#3A5560"/>
    <rect x="120" y="380" width="230" height="22" rx="8" fill="#1B3139"/>
    <text x="235" y="452" text-anchor="middle" class="lbl">설비 옆 엣지 판정</text>
    <text x="235" y="488" text-anchor="middle" class="sub">클라우드가 끊겨도 계속 · 수 ms</text>
  </g>

  <!-- model download arrow: cloud -> edge -->
  <path d="M1000 470c140 10 220 30 260 80" fill="none" stroke="#FF3621" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round" marker-end="url(#ahl)"/>
  <text x="1110" y="440" class="sub" fill="#C81E0F">모델 내려받기</text>
  <!-- retrain loop arrow -->
  <path d="M640 620c-30 110 20 200 70 230" fill="none" stroke="#1B3139" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)" opacity="0.55"/>
  <g transform="translate(700 840)">
    <rect width="330" height="120" rx="18" fill="#fff" stroke="#E7E3DC" stroke-width="3"/>
    <text x="28" y="50" class="lbl">학습 · 검증 · 승격</text>
    <text x="28" y="90" class="sub">Job · 감시 → 재학습</text>
  </g>
</svg>
